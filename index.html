<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านข้าวปั้นริมคลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap">
<style>
/* Layout: one-screen toy — shop scene on top (customer + conveyor), wooden cutting board in the middle, fridge shelf at the bottom; side-by-side on wide screens. Single sunny look by choice. */
:root{
  --wall:#bfe7df; --wall-line:#a6d9cf;
  --wood:#c27a43; --wood-dark:#8e5328;
  --board:#eebd82; --board-grain:#e2aa6b;
  --ink:#3b2a20; --paper:#fffaf1;
  --accent:#ff6b4a; --accent-dark:#d94a2b;
  --water:#5bb8d6; --fridge:#e3f4f7; --fridge-edge:#9fd3df;
  --font:'Mali', 'Leelawadee UI', 'Thonburi', 'Sarabun', system-ui, sans-serif;
  --item:clamp(64px, 11vmin, 100px);
  color-scheme:light;
}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
html,body{height:100%}
body{margin:0;background:#f7e2c6;color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.app{height:100%;box-sizing:border-box;display:grid;gap:10px;
  grid-template-rows:minmax(0,36fr) minmax(0,52fr) auto;
  grid-template-areas:"scene" "kitchen" "shelf";
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));}
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"scene kitchen" "shelf kitchen";}
}

/* ---------- Scene ---------- */
.scene{grid-area:scene;position:relative;overflow:hidden;border-radius:24px;container-type:size;
  border:3px solid var(--ink);
  background:
    linear-gradient(var(--wall-line) 2px, transparent 2px) 0 0/28px 28px,
    linear-gradient(90deg, var(--wall-line) 2px, transparent 2px) 0 0/28px 28px,
    var(--wall);
  --cw:min(40cqw, 66cqh, 230px);}
.window{position:absolute;left:4cqw;top:16cqh;width:min(26cqw,42cqh);aspect-ratio:1;border-radius:50%;
  border:6px solid var(--wood);background:var(--water);overflow:hidden;box-shadow:inset 0 0 0 3px var(--ink)}
.window svg{width:100%;height:100%;display:block}
.sign{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  font-weight:700;font-size:clamp(13px,3.6cqw,20px);padding:4px 16px 6px;border-radius:12px;border:3px solid var(--ink);
  white-space:nowrap;max-width:52cqw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 0 var(--ink)}
.corner-btn{position:absolute;top:8px;z-index:6;border:3px solid var(--ink);background:var(--paper);border-radius:14px;
  font-weight:700;font-size:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.corner-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.corner-btn svg{width:22px;height:22px}
#mute{left:8px}
#next{right:8px}
@media (max-width:520px){ #next .lbl{display:none} .sign{top:54px} }

.cust-wrap{position:absolute;bottom:23cqh;left:calc(60% - var(--cw)/2);width:var(--cw);aspect-ratio:1;z-index:2;
  transition:transform .45s cubic-bezier(.5,0,.3,1)}
.cust-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.cust-wrap.bob svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%)}}
.nametag{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,40%);z-index:4;background:var(--paper);
  border:2px solid var(--ink);border-radius:10px;padding:1px 10px 3px;font-size:13px;font-weight:700;white-space:nowrap}

.counter{position:absolute;left:0;right:0;bottom:0;height:24cqh;background:var(--wood);border-top:3px solid var(--ink);z-index:3}
.counter::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:var(--wood-dark)}
.belt{position:absolute;left:0;right:0;top:0;height:42%;border-bottom:3px solid var(--ink);
  background:repeating-linear-gradient(90deg,#5d6b74 0 18px,#4a565e 18px 36px);animation:belt 1.2s linear infinite}
@keyframes belt{to{background-position:36px 0}}

.plate{position:absolute;z-index:4;left:-160px;bottom:calc(24cqh - 18px);width:min(32cqw,140px);height:44px;
  background:#fff;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:16px;box-sizing:border-box}
.plate .mini{width:min(9cqw,44px);aspect-ratio:1;margin:0 -6px;position:relative;transition:transform .35s, opacity .35s}
.plate .mini svg{position:absolute;inset:0;width:100%;height:100%}
.plate.eaten .mini{transform:scale(.2);opacity:0}
.plate.eaten .mini:nth-child(2){transition-delay:.25s}.plate.eaten .mini:nth-child(3){transition-delay:.5s}
.plate.eaten .mini:nth-child(4){transition-delay:.7s}.plate.eaten .mini:nth-child(n+5){transition-delay:.85s}

.bubble{position:absolute;z-index:5;left:3cqw;top:max(52px,14cqh);width:max(130px, calc(60cqw - var(--cw)/2 - 6cqw));
  max-width:260px;box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:18px;
  padding:8px 12px 10px;font-weight:700;font-size:clamp(14px,3.4cqw,19px);line-height:1.35;text-wrap:balance;
  transform-origin:right center;transition:transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s}
.bubble::after{content:"";position:absolute;right:-14px;top:50%;width:18px;height:18px;background:var(--paper);
  border:3px solid var(--ink);border-left:0;border-bottom:0;transform:translateY(-50%) rotate(45deg) skew(10deg,10deg)}
.bubble.hide{transform:scale(.3);opacity:0}

/* ---------- Kitchen ---------- */
.kitchen{grid-area:kitchen;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.tools{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:60px;border:3px solid var(--ink);background:var(--paper);border-radius:16px;
  padding:4px 6px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:13px;
  box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s, background .15s}
.tool svg{width:34px;height:34px}
.tool[aria-pressed="true"]{background:#ffd76a;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool.action{background:#cdeec4}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.board{position:relative;min-height:0;border-radius:26px;border:3px solid var(--ink);overflow:hidden;
  background:
    repeating-linear-gradient(8deg, transparent 0 22px, var(--board-grain) 22px 25px, transparent 25px 47px),
    var(--board);
  box-shadow:inset 0 -10px 0 rgba(140,80,30,.25);touch-action:none}
.board::before{content:"";position:absolute;right:16px;top:14px;width:16px;height:16px;border-radius:50%;
  border:3px solid var(--ink);background:#f7e2c6}
.hint{position:absolute;left:12px;top:10px;margin:0;font-size:14px;font-weight:700;color:#7a4a22;max-width:calc(100% - 60px);z-index:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:16px;
  font-weight:700;color:#7a4a22;pointer-events:none;text-wrap:balance}

.item{position:absolute;width:var(--item);height:var(--item);z-index:1;
  left:calc((100% - var(--item)) * var(--x));top:calc(34px + (100% - var(--item) - 34px) * var(--y));
  cursor:grab;touch-action:none}
.item svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.item.dragging{z-index:9;cursor:grabbing;transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 8px 4px rgba(60,30,10,.3))}
.c1 svg.food{filter:sepia(.45) saturate(1.5) brightness(.88) hue-rotate(-8deg)}
.c2 svg.food{filter:brightness(.32) saturate(.3) contrast(1.2)}
.item.c2::after{content:"";position:absolute;left:30%;top:-30%;width:40%;height:50%;border-radius:50%;
  background:radial-gradient(circle,rgba(90,90,90,.55),transparent 70%);animation:smoke 1.6s ease-out infinite}
@keyframes smoke{from{transform:translateY(20%) scale(.6);opacity:.9}to{transform:translateY(-60%) scale(1.4);opacity:0}}

.fx-pop{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.2)}}
.fx-chop{animation:chop .3s}
@keyframes chop{25%{transform:translateX(-6%) rotate(-6deg)}50%{transform:translateX(6%) rotate(5deg)}75%{transform:translateX(-3%)}}
.fx-squish{animation:squish .4s}
@keyframes squish{30%{transform:scale(1.25,.75)}60%{transform:scale(.85,1.15)}}
.fx-wiggle{animation:wiggle .4s}
@keyframes wiggle{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.fx-sizzle::before{content:"";position:absolute;inset:-20% 10% 60% 10%;
  background:radial-gradient(circle at 30% 70%,rgba(255,255,255,.9) 0 8%,transparent 9%),
             radial-gradient(circle at 60% 50%,rgba(255,255,255,.8) 0 7%,transparent 8%),
             radial-gradient(circle at 45% 20%,rgba(255,255,255,.7) 0 6%,transparent 7%);
  animation:steam .7s ease-out forwards}
@keyframes steam{from{transform:translateY(30%);opacity:1}to{transform:translateY(-40%);opacity:0}}
.fx-roll{animation:rollin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes rollin{from{transform:scale(.3) rotate(-200deg)}}
.toss{transition:transform .3s ease-in, opacity .3s;transform:translateY(80%) rotate(40deg) scale(.4);opacity:0}
.flyup{transition:transform .3s ease-in, opacity .3s;transform:translateY(-140%) scale(.5);opacity:0}

.serve{position:absolute;right:12px;bottom:12px;z-index:10;border:3px solid var(--ink);background:var(--accent);
  color:#fff;font-weight:700;font-size:clamp(18px,4vmin,24px);padding:8px 22px 10px;border-radius:20px;
  box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:8px}
.serve svg{width:30px;height:30px}
.serve:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--accent-dark)}

.tip{position:absolute;left:50%;top:58px;transform:translate(-50%,-6px);z-index:12;background:var(--ink);color:#fff;
  font-weight:700;font-size:14px;padding:6px 14px 8px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;max-width:86%;text-align:center}
.tip.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Shelf (fridge) ---------- */
.shelf{grid-area:shelf;background:var(--fridge);border:3px solid var(--ink);border-radius:20px;
  padding:6px 8px 8px;min-width:0;box-shadow:inset 0 0 0 4px var(--fridge-edge)}
.shelf-label{font-weight:700;font-size:14px;padding:0 6px 4px;color:#2c6675}
.ings{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media (min-width:860px) and (min-aspect-ratio:1/1){ .ings{flex-wrap:wrap;overflow:visible} }
.ing{flex:0 0 auto;width:70px;border:2px solid var(--fridge-edge);background:#fff;border-radius:14px;padding:4px 2px 5px;
  display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;line-height:1.2}
.ing svg{width:46px;height:46px}
.ing:active{transform:scale(.92)}
.ing span{white-space:nowrap}

.chomp{transform-box:fill-box;transform-origin:center;animation:chomp .28s ease-in-out infinite alternate}
@keyframes chomp{to{transform:scaleY(.2)}}
.floaty{animation:floaty 1.4s ease-out infinite}
@keyframes floaty{from{transform:translateY(0);opacity:1}to{transform:translateY(-30px);opacity:0}}
.shake{animation:shk .12s linear 8}
@keyframes shk{50%{transform:translateX(3px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <section class="scene" id="scene" aria-label="หน้าร้าน">
    <div class="window" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" fill="#9be0f0"/>
        <circle cx="74" cy="26" r="11" fill="#ffd34d"/>
        <rect y="58" width="100" height="42" fill="#3d9fc4"/>
        <path d="M0 64 q8 -4 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="#bfeefa" stroke-width="2.5" fill="none"/>
        <path d="M0 80 q8 -4 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="#bfeefa" stroke-width="2.5" fill="none"/>
        <path d="M22 56 Q40 66 60 56 L56 50 L26 50Z" fill="#a8622e" stroke="#3b2a20" stroke-width="2"/>
        <path d="M34 50 L42 34 L50 50" fill="#ffe08a" stroke="#3b2a20" stroke-width="2"/>
      </svg>
    </div>
    <div class="sign">ร้านข้าวปั้นริมคลอง</div>
    <button class="corner-btn" id="mute" aria-label="ปิดเสียง"></button>
    <button class="corner-btn" id="next"><span class="lbl">ลูกค้าคนต่อไป</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="cust-wrap bob" id="custWrap"><div id="cust" style="width:100%;height:100%"></div><div class="nametag" id="nametag"></div></div>
    <div class="bubble" id="bubble"></div>
    <div class="counter"><div class="belt"></div></div>
    <div class="plate" id="plate"></div>
  </section>

  <section class="kitchen" aria-label="ครัว">
    <div class="tools" id="tools" role="toolbar" aria-label="เครื่องมือ"></div>
    <div class="board" id="board">
      <p class="hint" id="hint"></p>
      <div class="empty" id="empty">แตะวัตถุดิบในตู้เย็น<br>เพื่อวางลงบนเขียง</div>
    </div>
    <button class="serve" id="serve">
      <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="34" rx="20" ry="7" fill="#fff" stroke="#3b2a20" stroke-width="3"/><path d="M10 32 Q12 14 24 14 Q36 14 38 32" fill="#ffd76a" stroke="#3b2a20" stroke-width="3"/><circle cx="24" cy="11" r="3" fill="#ffd76a" stroke="#3b2a20" stroke-width="2.5"/></svg>
      เสิร์ฟ!
    </button>
    <div class="tip" id="tip" role="status"></div>
  </section>

  <section class="shelf" aria-label="ตู้เย็น">
    <div class="shelf-label">ตู้เย็น · แตะเพื่อหยิบ</div>
    <div class="ings" id="ings"></div>
  </section>
</div>

<script>
(function(){
const O='stroke="#4a3426" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function ring(cx,cy,R,n,fn){let s='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n;s+=fn(cx+R*Math.cos(a),cy+R*Math.sin(a),a*180/Math.PI);}return s;}
const slab=(f,st)=>`<path d="M12 46 Q16 26 50 26 Q84 26 88 46 Q88 72 50 74 Q12 72 12 46Z" fill="${f}" ${O}/><path d="M28 32 Q40 50 30 68 M48 29 Q60 50 50 72 M68 31 Q80 50 70 70" stroke="${st}" stroke-width="4" fill="none" stroke-linecap="round"/>`;

/* ---------- Ingredients (original drawings) ---------- */
const ING={
 rice:{name:'ข้าว',color:'#fffdf6',draw:(s=0)=>{
   const base=[`<ellipse cx="50" cy="55" rx="36" ry="29" fill="#fffdf6" ${O}/>`,
     `<path d="M50 14 Q60 14 86 70 Q90 84 76 85 L24 85 Q10 84 14 70 Q40 14 50 14Z" fill="#fffdf6" ${O}/>`,
     `<polygon points="${starPts(50,55,42,20)}" fill="#fffdf6" ${O}/>`,
     `<path d="M50 86 C18 64 10 44 22 30 C33 18 46 23 50 35 C54 23 67 18 78 30 C90 44 82 64 50 86Z" fill="#fffdf6" ${O}/>`][s];
   return base+`<g fill="#e6d9bf"><ellipse cx="42" cy="54" rx="4" ry="2.2" transform="rotate(-20 42 54)"/><ellipse cx="56" cy="48" rx="4" ry="2.2" transform="rotate(25 56 48)"/><ellipse cx="50" cy="62" rx="4" ry="2.2"/><ellipse cx="60" cy="60" rx="4" ry="2.2" transform="rotate(-35 60 60)"/><ellipse cx="44" cy="68" rx="4" ry="2.2" transform="rotate(30 44 68)"/></g>`;}},
 nori:{name:'สาหร่าย',color:'#22402f',draw:()=>`<rect x="14" y="18" width="72" height="64" rx="6" fill="#22402f" ${O}/><path d="M24 34 L76 30 M22 50 L78 48 M24 66 L74 68" stroke="#3a6b4f" stroke-width="3" fill="none"/>`},
 salmon:{name:'แซลมอน',color:'#f4874b',draw:()=>slab('#f4874b','#ffd9c2')},
 tuna:{name:'ทูน่า',color:'#c8324a',draw:()=>slab('#c8324a','#e9798a')},
 shrimp:{name:'กุ้ง',color:'#f59a6a',draw:()=>`<path d="M64 24 Q84 40 76 62 Q66 82 42 78" fill="none" stroke="#4a3426" stroke-width="26" stroke-linecap="round"/><path d="M64 24 Q84 40 76 62 Q66 82 42 78" fill="none" stroke="#f59a6a" stroke-width="20" stroke-linecap="round"/><path d="M68 36 l10 -5 M74 52 l11 1 M68 66 l8 7" stroke="#fff1e6" stroke-width="3" stroke-linecap="round"/><path d="M44 78 L22 64 L20 90Z" fill="#e5552c" ${O}/><circle cx="62" cy="27" r="3" fill="#2a1d14"/>`},
 squid:{name:'หมึก',color:'#f3dfe6',draw:()=>{const t='M38 60 q-6 14 2 26 M46 62 q-4 14 -6 26 M54 62 q4 14 6 26 M62 60 q6 14 -2 26';return `<path d="${t}" stroke="#4a3426" stroke-width="9" fill="none" stroke-linecap="round"/><path d="${t}" stroke="#f3dfe6" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 10 L72 40 L68 64 Q50 70 32 64 L28 40Z" fill="#f3dfe6" ${O}/><circle cx="42" cy="50" r="3.5" fill="#2a1d14"/><circle cx="58" cy="50" r="3.5" fill="#2a1d14"/><circle cx="42" cy="30" r="2.5" fill="#e9a6bd"/><circle cx="57" cy="25" r="3" fill="#e9a6bd"/>`;}},
 egg:{name:'ไข่หวาน',color:'#f8cf3c',draw:()=>`<rect x="16" y="32" width="68" height="42" rx="8" fill="#f8cf3c" ${O}/><path d="M19 42 H81" stroke="#c98a2a" stroke-width="7"/><path d="M22 56 H78 M22 65 H78" stroke="#e5ad22" stroke-width="3"/>`},
 cucumber:{name:'แตงกวา',color:'#5fae4e',draw:()=>`<circle cx="50" cy="50" r="34" fill="#3f8f3a" ${O}/><circle cx="50" cy="50" r="27" fill="#d6efb8"/><g fill="#9ccf7a">${ring(50,50,12,6,(x,y,a)=>`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4" ry="2" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`)}</g>`},
 avocado:{name:'อะโวคาโด',color:'#9cc75a',draw:()=>`<path d="M50 12 C66 12 70 34 78 52 C88 76 70 90 50 90 C30 90 12 76 22 52 C30 34 34 12 50 12Z" fill="#4f7a2b" ${O}/><path d="M50 20 C62 20 64 38 70 54 C78 74 64 82 50 82 C36 82 22 74 30 54 C36 38 38 20 50 20Z" fill="#c4e07a"/><circle cx="50" cy="62" r="13" fill="#8a5a32" ${O}/>`},

function cutSVG(type,shape){const d=ING[type].draw(shape);
  return [[0,30],[27,20],[52,32]].map(([x,y])=>`<svg x="${x}" y="${y}" width="48" height="48" viewBox="0 0 100 100" overflow="visible">${d}</svg>`).join('');}
function rollColors(fills){
  const wrap=fills.includes('nori')?'#22402f':fills.includes('egg')?'#f8cf3c':ING[fills[0]].color;
  const rice=fills.includes('rice')?'#fffdf6':'#f6e9d4';
  let dots=fills.filter(f=>f!=='nori'&&f!=='rice').map(f=>ING[f].color);
  if(!dots.length) dots=['#f6e9d4'];
  return {wrap,rice,dots};
}
function dotsAt(cx,cy,r,dots){ if(dots.length===1) return `<circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="${dots[0]}" stroke="#4a3426" stroke-width="1.5"/>`;
  return dots.slice(0,5).map((c,i,a)=>{const ang=i*2*Math.PI/a.length-Math.PI/2;return `<circle cx="${(cx+r*.42*Math.cos(ang)).toFixed(1)}" cy="${(cy+r*.42*Math.sin(ang)).toFixed(1)}" r="${(r*.36).toFixed(1)}" fill="${c}" stroke="#4a3426" stroke-width="1.2"/>`;}).join('');}
function rollSVG(it){const {wrap,rice,dots}=rollColors(it.fills);
  if(!it.cut){
    return `<rect x="6" y="34" width="84" height="36" rx="18" fill="${wrap}" ${O}/><path d="M24 40 V64 M40 40 V64 M56 40 V64" stroke="rgba(255,255,255,.18)" stroke-width="3"/><ellipse cx="80" cy="52" rx="12" ry="17" fill="${wrap}" ${O}/><ellipse cx="80" cy="52" rx="8.5" ry="13" fill="${rice}"/>${dotsAt(80,52,8,dots)}`;}
  return [[25,46],[52,60],[77,44]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="17" fill="${wrap}" ${O}/><circle cx="${x}" cy="${y}" r="12" fill="${rice}"/>${dotsAt(x,y,10,dots)}`).join('');}
function foodSVG(it){
  const inner=it.kind==='roll'?rollSVG(it):(it.cut?cutSVG(it.type,it.shape):ING[it.type].draw(it.shape));
  const deco=it.deco.length?`<svg viewBox="0 0 100 100">${it.deco.map(d=>DECO[d]).join('')}</svg>`:'';
  return `<svg viewBox="0 0 100 100" class="food">${inner}</svg>${deco}`;}
function nameOf(it){ return it.kind==='roll'?'ซูชิม้วน':ING[it.type].name; }

function heart(x,y,r,fill='#ff4d6d'){return `<path d="M${x} ${y+r*.9} C${x-r*1.6} ${y-r*.2} ${x-r*.8} ${y-r*1.3} ${x} ${y-r*.4} C${x+r*.8} ${y-r*1.3} ${x+r*1.6} ${y-r*.2} ${x} ${y+r*.9}Z" fill="${fill}" stroke="#4a3426" stroke-width="2"/>`;}
function face(e,o){
  const {lx,rx,ey,mx,my}=o, K='stroke="#1b120c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const ck=e==='hot'?'#ff3b30':e==='yuck'?'#8bc34a':'#ff8fa3', op=e==='hot'?.85:.55;
  let s=`<ellipse cx="${lx-9}" cy="${ey+17}" rx="8" ry="5" fill="${ck}" opacity="${op}"/><ellipse cx="${rx+9}" cy="${ey+17}" rx="8" ry="5" fill="${ck}" opacity="${op}"/>`;
  const eye=x=>{switch(e){
    case 'happy':return `<path d="M${x-7} ${ey+3} Q${x} ${ey-8} ${x+7} ${ey+3}" ${K}/>`;
    case 'love':return heart(x,ey,9);
    case 'yuck':return `<path d="M${x-6} ${ey-6} L${x+6} ${ey+6} M${x+6} ${ey-6} L${x-6} ${ey+6}" ${K}/>`;
    case 'hot':return x===lx?`<path d="M${x-7} ${ey-6} L${x+5} ${ey} L${x-7} ${ey+6}" ${K}/>`:`<path d="M${x+7} ${ey-6} L${x-5} ${ey} L${x+7} ${ey+6}" ${K}/>`;
    case 'eat':return `<path d="M${x-7} ${ey} Q${x} ${ey+6} ${x+7} ${ey}" ${K}/>`;
    case 'wait':return `<circle cx="${x}" cy="${ey}" r="7" fill="#1b120c"/><circle cx="${x+2}" cy="${ey-2}" r="2.5" fill="#fff"/><path d="M${x-8} ${ey-15} L${x+8} ${ey-18}" ${K}/>`;
    default:return `<circle cx="${x}" cy="${ey}" r="6.5" fill="#1b120c"/><circle cx="${x+2}" cy="${ey-2}" r="2.2" fill="#fff"/>`;}};
  s+=eye(lx)+eye(rx);
  const D='fill="#8a2b2b" stroke="#1b120c" stroke-width="3" stroke-linejoin="round"';
  switch(e){
    case 'happy':s+=`<path d="M${mx-13} ${my-2} Q${mx} ${my+18} ${mx+13} ${my-2} Z" ${D}/>`;break;
    case 'love':s+=`<path d="M${mx-15} ${my-3} Q${mx} ${my+22} ${mx+15} ${my-3} Z" ${D}/><ellipse cx="${mx}" cy="${my+9}" rx="6" ry="3.5" fill="#ff7a8a"/>`+
      `<g class="floaty">${heart(rx+30,ey-26,7)}</g><g class="floaty" style="animation-delay:.6s">${heart(lx-30,ey-20,6)}</g>`;break;
    case 'yuck':s+=`<path d="M${mx-14} ${my+3} q3.5 -6 7 0 t7 0 t7 0 t7 0" ${K}/><path d="M${mx+4} ${my+5} q3 8 0 12" stroke="#8bc34a" stroke-width="5" fill="none" stroke-linecap="round"/>`;break;
    case 'hot':s+=`<ellipse cx="${mx}" cy="${my+2}" rx="12" ry="10" ${D}/><ellipse cx="${mx}" cy="${my+9}" rx="7" ry="5" fill="#ff7a8a"/>`+
      `<g class="floaty"><path d="M${lx-26} ${ey-14} q-7 -8 0 -16 q7 -8 0 -16" stroke="#9aa5ad" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="floaty" style="animation-delay:.5s"><path d="M${rx+26} ${ey-14} q-7 -8 0 -16 q7 -8 0 -16" stroke="#9aa5ad" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;break;
    case 'eat':s+=`<ellipse class="chomp" cx="${mx}" cy="${my+2}" rx="11" ry="7" ${D}/>`;break;
    case 'wait':s+=`<circle cx="${mx}" cy="${my+2}" r="5" ${D}/>`;break;
    default:s+=`<path d="M${mx-9} ${my} Q${mx} ${my+7} ${mx+9} ${my}" ${K}/>`;}
  return s;}

const Snd={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  tone(f,d,type='sine',v=.15,f2,delay=0){if(!this.on||!this.ctx)return;const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+d+.05);},
  noise(d,v=.2,freq=2000,delay=0){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+delay;
    const b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t);}
};

const board=$('board');

function mk(type,x,y,extra){return Object.assign({id:uid++,kind:'ing',type,x,y,cut:false,cook:0,shape:0,deco:[]},extra||{});}
S.items.push(mk('rice',.28,.35,{shape:1}), mk('salmon',.62,.5), mk('nori',.12,.85));

function renderTools(){
  $('tools').innerHTML=TOOLS.map(([k,l,act])=>`<button class="tool${act?' action':''}" data-tool="${k}" ${act?'':`aria-pressed="${S.tool===k}"`}><svg viewBox="0 0 48 48" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join('');
  $('hint').textContent=HINT[S.tool];}
function renderShelf(){
  $('ings').innerHTML=ORDER.map(k=>`<button class="ing" data-ing="${k}" aria-label="หยิบ${ING[k].name}"><svg viewBox="0 0 100 100" aria-hidden="true">${ING[k].draw(0)}</svg><span>${ING[k].name}</span></button>`).join('');}
function render(){
  board.querySelectorAll('.item').forEach(n=>n.remove());
  S.items.forEach(it=>{
    const el=document.createElement('div');
    el.className='item c'+it.cook+(S.fx&&S.fx.id===it.id?' fx-'+S.fx.cls:'');
    el.dataset.id=it.id;el.tabIndex=0;el.setAttribute('role','button');
    el.setAttribute('aria-label',nameOf(it)+(it.cut?' หั่นแล้ว':'')+(it.cook===1?' สุกแล้ว':it.cook===2?' ไหม้':''));
    el.style.setProperty('--x',it.x);el.style.setProperty('--y',it.y);
    el.innerHTML=foodSVG(it);board.appendChild(el);});
  S.fx=null;
  $('empty').hidden=S.items.length>0;}

let tipT;
function tip(t){const e=$('tip');e.textContent=t;e.classList.add('show');clearTimeout(tipT);tipT=setTimeout(()=>e.classList.remove('show'),1800);}
const find=id=>S.items.find(i=>i.id==id);

function addItem(type){
  if(S.items.length>=12){tip('เขียงเต็มแล้ว! ลองเสิร์ฟก่อนนะ');sfx.empty();return;}
  const it=mk(type,.08+Math.random()*.84,.1+Math.random()*.8);S.items.push(it);S.fx={id:it.id,cls:'pop'};render();sfx.pop();}

function apply(it,el){
  switch(S.tool){
    case 'knife':
      if(it.cut){tip('หั่นแล้วจ้า');S.fx={id:it.id,cls:'wiggle'};sfx.boop();}
      else{it.cut=true;S.fx={id:it.id,cls:'chop'};sfx.chop();}
      break;
    case 'pan':
      if(it.cook>=2){tip('ไหม้หมดแล้ว!');S.fx={id:it.id,cls:'wiggle'};sfx.burnt();}
      else{it.cook++;S.fx={id:it.id,cls:'sizzle'};sfx.sizzle();if(it.cook===2)tip('อุ๊ย ไหม้แล้ว!');}
      break;
    case 'shape':
      if(it.kind==='ing'&&it.type==='rice'){it.shape=(it.shape+1)%4;it.cut=false;S.fx={id:it.id,cls:'squish'};sfx.squish();}
      else{tip('ปั้นได้เฉพาะข้าวนะ');S.fx={id:it.id,cls:'wiggle'};sfx.boop();}
      break;
    case 'deco':{
      const next=DECO_ORDER.find(d=>!it.deco.includes(d));
      if(next){it.deco.push(next);sfx.sparkle();}else{it.deco=[];sfx.toss();}
      S.fx={id:it.id,cls:'squish'};break;}
    case 'trash':
      el.classList.add('toss');sfx.toss();
      setTimeout(()=>{S.items=S.items.filter(i=>i!==it);render();},300);return;
    default:S.fx={id:it.id,cls:'wiggle'};sfx.boop();}
  render();}

function rollAll(){
  if(S.serving)return;
  if(S.items.length<2){tip('วางของบนเขียงอย่างน้อย 2 อย่างก่อนม้วนนะ');sfx.empty();return;}
  const fills=[];S.items.forEach(it=>(it.kind==='roll'?it.fills:[it.type]).forEach(f=>{if(!fills.includes(f))fills.push(f);}));
  const cook=Math.max(...S.items.map(i=>i.cook));
  const r=mk(null,.5,.5,{kind:'roll',fills,cook});
  S.items=[r];S.fx={id:r.id,cls:'roll'};render();sfx.roll();
  tip(fills.includes('nori')?'ม้วนเสร็จ! ลองหั่นด้วยมีดดูสิ':'ห่อเสร็จแล้ว! ลองใส่สาหร่ายด้วยก็ได้นะ');}

/* ---------- Customer ---------- */
function setExpr(e){const c=CUSTOMERS[S.cust];$('cust').innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="${c.name}">${c.draw(e)}</svg>`;}
function say(t){const b=$('bubble');b.classList.add('hide');setTimeout(()=>{b.textContent=t;b.classList.remove('hide');},120);}
function showCustomer(){const c=CUSTOMERS[S.cust];setExpr('neutral');$('nametag').textContent=c.name;say(c.greet);}

function judge(items,c){
  let score=0,burnt=0,chili=false;
  items.forEach(it=>{
    if(it.cook>=2)burnt++;
    (it.kind==='roll'?it.fills:[it.type]).forEach(f=>{
      if(f==='chili')chili=true;
      if(c.likes.includes(f))score+=2;else if(c.dislikes.includes(f))score-=2;});
    if(it.deco.length)score+=1;
    if(it.kind==='roll'&&it.cut)score+=1;});
  if(chili&&!c.hot)return 'hot';
  if(burnt)return 'burnt';
  if(score>=4)return 'love';
  if(score>=1)return 'happy';
  if(score===0)return 'ok';
  return 'yuck';}
const EXPR={love:'love',happy:'happy',ok:'neutral',yuck:'yuck',burnt:'yuck',hot:'hot',empty:'wait'};

function react(r){
  const w=$('custWrap');setExpr(EXPR[r]);say(pick(PHRASE[r]));sfx[r]();
  if(r==='hot'||r==='yuck'||r==='burnt'){w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');}}

async function serve(){
  if(S.serving)return;Snd.init();
  const items=S.items.slice();
  if(!items.length){react('empty');setTimeout(()=>{if(!S.serving)setExpr('neutral');},1800);return;}
  S.serving=true;
  board.querySelectorAll('.item').forEach(n=>n.classList.add('flyup'));
  await sleep(300);S.items=[];render();
  const plate=$('plate'),scene=$('scene').getBoundingClientRect(),cw=$('custWrap').getBoundingClientRect();
  plate.classList.remove('eaten');
  plate.innerHTML=items.slice(0,6).map(it=>`<div class="mini c${it.cook}">${foodSVG(it)}</div>`).join('');
  plate.style.transition='none';plate.style.left=(-plate.offsetWidth-20)+'px';void plate.offsetWidth;
  plate.style.transition='left 1.1s cubic-bezier(.3,.7,.4,1)';
  plate.style.left=(cw.left+cw.width/2-scene.left-plate.offsetWidth/2)+'px';
  setExpr('wait');say('ว้าว มาแล้ว!');sfx.belt();
  await sleep(1150);
  setExpr('eat');$('bubble').classList.add('hide');plate.classList.add('eaten');sfx.munch();
  await sleep(1300);
  react(judge(items,CUSTOMERS[S.cust]));
  await sleep(600);
  plate.style.transition='left .8s ease-in';plate.style.left=(scene.width+20)+'px';
  await sleep(1800);
  setExpr('neutral');S.serving=false;}

async function nextCustomer(){
  if(S.serving)return;S.serving=true;Snd.init();
  const w=$('custWrap');$('bubble').classList.add('hide');
  w.style.transform='translateX(140cqw)';await sleep(460);
  S.cust=(S.cust+1)%CUSTOMERS.length;
  w.style.transition='none';w.style.transform='translateX(-160cqw)';void w.offsetWidth;
  w.style.transition='';showCustomer();$('bubble').classList.add('hide');
  w.style.transform='translateX(0)';await sleep(460);
  say(CUSTOMERS[S.cust].greet);sfx.hello();S.serving=false;}

/* ---------- Events ---------- */
$('tools').addEventListener('click',e=>{const b=e.target.closest('.tool');if(!b)return;Snd.init();
  const k=b.dataset.tool;if(k==='roll'){rollAll();return;}S.tool=k;renderTools();sfx.boop();});
$('ings').addEventListener('click',e=>{const b=e.target.closest('.ing');if(!b)return;Snd.init();addItem(b.dataset.ing);});
$('serve').addEventListener('click',serve);
$('next').addEventListener('click',nextCustomer);
$('mute').addEventListener('click',()=>{Snd.on=!Snd.on;Snd.init();drawMute();if(Snd.on)sfx.boop();});
function drawMute(){const m=$('mute');m.setAttribute('aria-label',Snd.on?'ปิดเสียง':'เปิดเสียง');
  m.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor"/>${Snd.on?'<path d="M16 8q3 4 0 8M18.5 5.5q5 6.5 0 13" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>':'<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;}

let drag=null;
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.item');if(!el)return;Snd.init();
  const r=el.getBoundingClientRect();
  drag={it:find(el.dataset.id),el,sx:e.clientX,sy:e.clientY,moved:false,ox:e.clientX-r.left,oy:e.clientY-r.top};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
});
board.addEventListener('pointermove',e=>{
  if(!drag||!drag.it)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){drag.moved=true;drag.el.classList.add('dragging');}
  if(!drag.moved)return;
  const b=board.getBoundingClientRect(),w=drag.el.offsetWidth,h=drag.el.offsetHeight;
  const x=Math.min(1,Math.max(0,(e.clientX-b.left-drag.ox)/(b.width-w)));
  const y=Math.min(1,Math.max(0,(e.clientY-b.top-drag.oy-34)/(b.height-h-34)));
  drag.it.x=x;drag.it.y=y;drag.el.style.setProperty('--x',x);drag.el.style.setProperty('--y',y);
});
function endDrag(){if(!drag)return;const d=drag;drag=null;
  if(!d.it)return;
  if(d.moved){d.el.classList.remove('dragging');}else apply(d.it,d.el);}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',()=>{if(drag){drag.el.classList.remove('dragging');drag=null;}});
board.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('item')){e.preventDefault();Snd.init();
  const it=find(e.target.dataset.id);if(it)apply(it,e.target);}});

renderTools();renderShelf();render();drawMute();showCustomer();
})();
</script>

</body>
